services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: depgraph
      POSTGRES_PASSWORD: depgraph
      POSTGRES_DB: depgraph
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depgraph"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      # The whole database is rebuildable from the registry, so durability buys nothing
      # and costs every test run a disk sync.
      - /var/lib/postgresql/data
